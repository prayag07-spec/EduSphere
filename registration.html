<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | EduSphere</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/registration.js" defer></script>
</head>

<body>

<header>
    <nav class="navbar">

        <a href="index.html" class="logo">EduSphere</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="registration.html" class="active">Register</a></li>
        </ul>

    </nav>
</header>

<main>

    <section class="registration-section">

        <div class="registration-container">

            <h1>Student Registration</h1>

            <p>
                Join EduSphere and start your learning journey today.
            </p>

            <form id="registrationForm">

                <div class="form-group">

                    <label for="studentName">Full Name</label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="studentEmail">Email Address</label>

                    <input
                        type="email"
                        id="studentEmail"
                        name="studentEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="course">Select Course</label>

                    <select id="course" name="course" required>

                        <option value="">Choose a course</option>

                        <option value="html">HTML & CSS</option>

                        <option value="python">Python Programming</option>

                        <option value="java">Java Programming</option>

                        <option value="dsa">Data Structures and Algorithms</option>

                        <option value="networks">Computer Networks</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="studentPassword">Password</label>

                    <input
                        type="password"
                        id="studentPassword"
                        name="studentPassword"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>

                <p
                    id="formMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-btn"
                >
                    Register Now
                </button>

            </form>

        </div>

    </section>

</main>

<footer>

    <p>&copy; 2026 EduSphere. All rights reserved.</p>

</footer>

</body>
</html>
